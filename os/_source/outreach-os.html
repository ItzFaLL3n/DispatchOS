<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dispatch — Outreach Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --font-display: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue Condensed', sans-serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --font-mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;

    --rail-bg: #1D1B17;
    --rail-line: rgba(255,255,255,0.08);
    --rail-text: #B7AF9B;
    --rail-text-active: #F5F1E6;
    --rail-active-bg: rgba(225,83,33,0.18);

    --paper: #F1ECDF;
    --paper-hover: #E7DFC7;
    --card: #FFFDF8;

    --ink: #211D17;
    --ink-soft: #6E6656;
    --ink-faint: #A79E89;

    --line: #DED2B8;
    --line-strong: #C7B896;

    --accent: #E15321;
    --accent-hover: #C4441A;
    --accent-soft: #FBE1CF;

    --good: #2F6B3D;
    --warn: #B4740E;
    --bad: #B23A2E;
    --info: #2A5C8A;

    --radius-sm: 4px;
    --radius-md: 6px;
    --shadow-card: 0 1px 2px rgba(33,29,23,0.07);
    --shadow-modal: 0 24px 48px rgba(20,17,12,0.30);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background-color: var(--paper);
    background-image: radial-gradient(circle, rgba(33,29,23,0.06) 1px, transparent 1px);
    background-size: 15px 15px;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  ::selection { background: var(--accent-soft); }

  .app { display: flex; min-height: 100vh; }

  /* Sidebar / rail */
  .sidebar {
    width: 232px; flex-shrink: 0;
    background: var(--rail-bg);
    display: flex; flex-direction: column;
    padding: 18px 8px;
    height: 100vh; position: sticky; top: 0;
  }
  .sidebar-header { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; border-bottom: 1px solid var(--rail-line); margin-bottom: 6px; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: var(--radius-sm);
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-weight: 700; font-size: 13px; flex-shrink: 0;
  }
  .brand-name { font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: 0.02em; text-transform: uppercase; color: var(--rail-text-active); line-height: 1.15; }
  .brand-sub { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--rail-text); margin-top: 1px; }

  .nav-group-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.32); padding: 14px 12px 6px; }
  .nav { display: flex; flex-direction: column; gap: 1px; }
  .nav-item {
    display: flex; align-items: center; gap: 9px;
    padding: 8px 10px 8px 12px; border-radius: var(--radius-sm);
    background: transparent; border: none; border-left: 2px solid transparent; cursor: pointer;
    color: var(--rail-text); font-size: 13px; text-align: left;
    transition: background 0.12s ease, color 0.12s ease;
  }
  .nav-item:hover { background: rgba(255,255,255,0.05); color: var(--rail-text-active); }
  .nav-item.active { background: var(--rail-active-bg); color: var(--rail-text-active); border-left-color: var(--accent); font-weight: 600; }
  .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
  .nav-num { font-family: var(--font-mono); font-size: 10.5px; opacity: 0.6; width: 15px; }
  .sidebar-footer {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.04em; color: var(--rail-text);
    padding: 12px 12px 4px; border-top: 1px solid var(--rail-line);
    margin-top: auto; line-height: 1.7; text-transform: uppercase; opacity: 0.75;
  }
  .mobile-menu-btn {
    display: none; position: fixed; top: 12px; left: 12px; z-index: 50;
    width: 34px; height: 34px; border-radius: var(--radius-sm);
    background: var(--card); border: 1px solid var(--line-strong);
    cursor: pointer; box-shadow: var(--shadow-card); align-items: center; justify-content: center; color: var(--ink);
  }
  .mobile-menu-btn svg { width: 18px; height: 18px; }

  /* Main */
  .main { flex: 1; min-width: 0; padding: 40px 46px 90px; max-width: 1000px; }
  .page.hidden { display: none; }
  .ticket-head { margin-bottom: 26px; }
  .ticket-meta { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); }
  .page-title { font-family: var(--font-display); font-weight: 700; font-size: 34px; text-transform: uppercase; letter-spacing: 0.01em; line-height: 1; margin: 8px 0 12px; color: var(--ink); }
  .ticket-rule { height: 1px; background: var(--line-strong); margin-bottom: 4px; position: relative; }
  .ticket-rule::after { content: ''; display: block; height: 1px; background: var(--line); margin-top: 4px; }
  .page-sub { color: var(--ink-soft); font-size: 13.5px; line-height: 1.55; max-width: 560px; margin-top: 12px; }

  /* Grid */
  .grid { display: grid; gap: 14px; }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  .grid-2 { grid-template-columns: 1fr 1fr; }
  @media (max-width: 900px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } .grid-2 { grid-template-columns: 1fr; } }

  .stat-card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius-md); padding: 16px;
    box-shadow: var(--shadow-card); border-bottom: 2px solid var(--line-strong);
  }
  .stat-num { font-family: var(--font-mono); font-size: 27px; font-weight: 600; }
  .stat-label { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); margin-top: 5px; }

  .panel {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius-md); padding: 18px 20px;
    box-shadow: var(--shadow-card);
  }
  .panel-title {
    font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--ink-soft); margin: 0 0 14px; display: flex; align-items: center; justify-content: space-between;
  }
  .empty-state { color: var(--ink-faint); font-size: 13px; padding: 18px 4px; text-align: center; }

  .list-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); gap: 10px; }
  .list-row:last-child { border-bottom: none; }
  .list-row-title { font-size: 13.5px; font-weight: 500; }
  .list-row-meta { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); margin-top: 2px; }

  /* Stamps (status + priority) */
  .stamp {
    display: inline-flex; align-items: center; white-space: nowrap;
    font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 3px 8px; border: 1.4px solid currentColor; border-radius: 3px;
    background: rgba(255,255,255,0.55); transform: rotate(-1deg);
  }
  .stamp-active, .stamp-posted { color: var(--good); }
  .stamp-pending { color: var(--warn); }
  .stamp-scheduled { color: var(--info); }
  .stamp-flagged { color: var(--bad); }
  .stamp-review, .stamp-draft, .stamp-low { color: var(--ink-soft); }
  .stamp-medium { color: var(--info); }
  .stamp-high { color: var(--bad); }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: var(--radius-sm);
    font-size: 12.5px; font-weight: 600; letter-spacing: 0.01em; cursor: pointer;
    border: 1.5px solid var(--line-strong); background: var(--card); color: var(--ink);
    transition: background 0.12s ease, border-color 0.12s ease;
  }
  .btn:hover { background: var(--paper-hover); }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-sm { padding: 4px 10px; font-size: 11.5px; }
  .btn-ghost { border-color: transparent; background: transparent; color: var(--ink-soft); }
  .btn-ghost:hover { background: var(--paper-hover); color: var(--ink); }
  .btn-danger { color: var(--bad); }
  .btn:focus-visible, .nav-item:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

  /* Forms */
  label { display: block; font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 6px; }
  input[type=text], input[type=number], input[type=date], select, textarea {
    width: 100%; padding: 8px 10px; border-radius: var(--radius-sm);
    border: 1.4px solid var(--line-strong); background: #fff; color: var(--ink);
    font-size: 13.5px; font-family: var(--font-body);
  }
  textarea { resize: vertical; min-height: 70px; }
  .field { margin-bottom: 14px; }
  .field-row { display: flex; gap: 12px; }
  .field-row > .field { flex: 1; }

  /* Toggle */
  .toggle-group { display: inline-flex; border: 1.4px solid var(--line-strong); border-radius: var(--radius-sm); overflow: hidden; }
  .toggle-opt { padding: 7px 15px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; font-weight: 600; cursor: pointer; color: var(--ink-soft); border: none; background: var(--card); }
  .toggle-opt.active { background: var(--accent); color: #fff; }

  /* Post output */
  .output-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
  @media (max-width: 800px) { .output-grid { grid-template-columns: 1fr; } }
  .output-card { border: 1px solid var(--line); border-radius: var(--radius-md); padding: 14px 16px; background: var(--paper); }
  .output-card h4 { margin: 0 0 8px; font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); font-weight: 600; }
  .output-text { white-space: pre-wrap; font-size: 13.5px; line-height: 1.6; color: var(--ink); font-family: var(--font-body); }

  /* Table */
  .table { width: 100%; border-collapse: collapse; }
  .table th { text-align: left; font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); padding: 8px 10px; border-bottom: 1px solid var(--line-strong); }
  .table td { padding: 10px 10px; border-bottom: 1px solid var(--line); font-size: 13px; vertical-align: top; }
  .table tr:last-child td { border-bottom: none; }
  .notes-preview { color: var(--ink-soft); font-size: 12.5px; max-width: 260px; }

  /* Kanban */
  .kanban { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 800px) { .kanban { grid-template-columns: 1fr; } }
  .kanban-col { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 12px; min-height: 120px; }
  .kanban-col-title { font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .kanban-count { background: var(--card); border: 1px solid var(--line-strong); border-radius: 3px; padding: 1px 7px; font-family: var(--font-mono); font-size: 10.5px; }
  .task-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 8px; box-shadow: var(--shadow-card); }
  .task-title { font-size: 13px; font-weight: 500; margin-bottom: 6px; }
  .task-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-faint); margin-bottom: 8px; }
  .task-actions { display: flex; gap: 5px; }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(20,17,12,0.4); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal-overlay.hidden { display: none; }
  .modal { background: var(--card); border: 1px solid var(--line-strong); border-radius: var(--radius-md); padding: 22px 24px; width: 100%; max-width: 440px; box-shadow: var(--shadow-modal); max-height: 88vh; overflow-y: auto; }
  .modal h3 { font-family: var(--font-display); font-weight: 700; font-size: 21px; text-transform: uppercase; letter-spacing: 0.01em; margin: 0 0 16px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }

  /* Toast */
  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--paper); padding: 10px 18px;
    border-radius: var(--radius-sm); font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.03em; opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease; z-index: 200;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Playbook */
  .pb-section { margin-bottom: 22px; }
  .pb-section h3 { font-family: var(--font-display); font-weight: 700; font-size: 17px; text-transform: uppercase; letter-spacing: 0.01em; margin: 0 0 10px; color: var(--ink); }
  .pb-section ul { margin: 0; padding-left: 18px; color: var(--ink); font-size: 13.5px; line-height: 1.7; }
  .pb-section p { font-size: 13.5px; line-height: 1.7; color: var(--ink); margin: 4px 0; }

  @media (max-width: 768px) {
    .mobile-menu-btn { display: flex; }
    .sidebar { position: fixed; z-index: 40; left: -260px; transition: left 0.2s ease; box-shadow: var(--shadow-modal); }
    .sidebar.open { left: 0; }
    .main { padding: 66px 18px 60px; }
    .grid-4 { grid-template-columns: 1fr 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle menu">
  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 6h14M3 10h14M3 14h14"/></svg>
</button>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand-mark">D</div>
      <div>
        <div class="brand-name">Dispatch</div>
        <div class="brand-sub">outreach console</div>
      </div>
    </div>
    <nav class="nav" id="navList">
      <div class="nav-group-label">Overview</div>
      <button class="nav-item" data-page="dashboard">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="2.5" width="6" height="6" rx="1"/><rect x="11.5" y="2.5" width="6" height="6" rx="1"/><rect x="2.5" y="11.5" width="6" height="6" rx="1"/><rect x="11.5" y="11.5" width="6" height="6" rx="1"/></svg>
        <span>Dashboard</span>
      </button>

      <div class="nav-group-label">Workflow</div>
      <button class="nav-item" data-page="clients">
        <span class="nav-num">01</span>
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="15" height="12" rx="1.5"/><path d="M2.5 8h15"/><circle cx="6.5" cy="12" r="1.3"/><path d="M9.5 12h4"/></svg>
        <span>Clients</span>
      </button>
      <button class="nav-item" data-page="groups">
        <span class="nav-num">02</span>
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="2.6"/><circle cx="14" cy="8" r="2.1"/><path d="M2.5 17c0-2.8 2-4.6 4.5-4.6s4.5 1.8 4.5 4.6"/><path d="M12.8 12.9c1.9.2 3.2 1.7 3.2 4.1"/></svg>
        <span>Groups</span>
      </button>
      <button class="nav-item" data-page="creator">
        <span class="nav-num">03</span>
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 3.5l3 3L6 17H3v-3z"/></svg>
        <span>Creator</span>
      </button>
      <button class="nav-item" data-page="schedule">
        <span class="nav-num">04</span>
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="2.5" y="4" width="15" height="13.5" rx="1.5"/><path d="M2.5 8h15"/><path d="M6.5 2.5v3"/><path d="M13.5 2.5v3"/></svg>
        <span>Schedule</span>
      </button>
      <button class="nav-item" data-page="library">
        <span class="nav-num">05</span>
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M10 2.5l7.5 3.8L10 10 2.5 6.3z"/><path d="M2.5 10.5L10 14l7.5-3.5"/><path d="M2.5 14.5L10 18l7.5-3.5"/></svg>
        <span>Library</span>
      </button>
      <button class="nav-item" data-page="todo">
        <span class="nav-num">06</span>
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="2.5" width="15" height="15" rx="2"/><path d="M6 10l2.7 2.7L14 7.2"/></svg>
        <span>Todo</span>
      </button>

      <div class="nav-group-label">Reference</div>
      <button class="nav-item" data-page="playbook">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M2.5 4c1.8-1 4-1.2 7 0v12c-3-1.2-5.2-1-7 0z"/><path d="M17.5 4c-1.8-1-4-1.2-7 0v12c3-1.2 5.2-1 7 0z"/></svg>
        <span>Playbook</span>
      </button>
    </nav>
    <div class="sidebar-footer">2 spots · honest terms<br>no bait-and-switch</div>
  </aside>

  <main class="main">
    <section id="page-dashboard" class="page"></section>
    <section id="page-clients" class="page hidden"></section>
    <section id="page-creator" class="page hidden"></section>
    <section id="page-library" class="page hidden"></section>
    <section id="page-schedule" class="page hidden"></section>
    <section id="page-groups" class="page hidden"></section>
    <section id="page-todo" class="page hidden"></section>
    <section id="page-playbook" class="page hidden"></section>
  </main>
</div>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------------- State ---------------- */
const appState = { groups: [], posts: [], todos: [], clients: [] };
let currentPage = 'dashboard';

/* ---------------- Utilities ---------------- */
function esc(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function genId(prefix) { return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function todayISO() { return new Date().toISOString().slice(0,10); }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
function pageHeader(formNo, title, sub) {
  return `
    <div class="ticket-head">
      <div class="ticket-meta">Form No. ${formNo} &middot; ${new Date().toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'numeric'})}</div>
      <h1 class="page-title">${title}</h1>
      <div class="ticket-rule"></div>
      <div class="page-sub">${sub}</div>
    </div>
  `;
}
function statusBadge(status) {
  const map = {
    active: ['active','stamp-active'], pending: ['pending','stamp-pending'],
    flagged: ['flagged','stamp-flagged'], 'needs-review': ['needs review','stamp-review'],
    draft: ['draft','stamp-draft'], scheduled: ['scheduled','stamp-scheduled'], posted: ['posted','stamp-posted']
  };
  const [label, cls] = map[status] || map['needs-review'];
  return `<span class="stamp ${cls}">${label}</span>`;
}
function priorityPill(p) {
  const map = { low: ['low','stamp-low'], medium: ['medium','stamp-medium'], high: ['high','stamp-high'] };
  const [label, cls] = map[p] || map.low;
  return `<span class="stamp ${cls}">${label}</span>`;
}
function groupName(id) {
  const g = appState.groups.find(g => g.id === id);
  return g ? g.name : null;
}
function buildStatusBadge(status) {
  const map = {
    'not-started': ['not started', 'stamp-draft'],
    'in-progress': ['in progress', 'stamp-pending'],
    'delivered': ['delivered', 'stamp-active']
  };
  const [label, cls] = map[status] || map['not-started'];

   already-seeded board) with the now-confirmed HeartLand details, so this doesn't just
   land in fresh seed data that only new/empty boards would ever see. Guarded so it only
   runs once. */
async function patchHeartlandClient() {
  try {

  } catch(e) {}

  const already = appState.clients.some(c => c.businessName === 'HeartLand Demo & Junk Removal');

function templateGenerate(ctx) {
  const offerLabel = ctx.offerType === 'review-agent' ? 'a free google review agent'
    : ctx.offerType === 'both' ? 'a website and google review agent'
    : 'a website';
  const costAdj = ctx.costPhrase === 'free' ? `a free ${offerLabel.replace('a free ','')} built for them`
    : `${offerLabel.replace('a free ','a ')} built for them, ${ctx.costPhrase}`;
  const gifVersion = `looking for ${ctx.spots} ${ctx.niche} to get ${costAdj}.\nyou own it, host it anywhere; all i ask for is feedback.\nreach out if that's you.`;
  const normalVersion = `looking for ${ctx.spots} ${ctx.niche} to get ${costAdj}.\n\nyou own it, host it anywhere, no strings — all i ask for is feedback on how it's actually helping bring in more calls and jobs.\n\nonly taking ${ctx.spots} right now so i can put real time into each one instead of spreading thin.\n\nif that's you, reach out and we'll get started.`;
  return { gifVersion, normalVersion };
}

async function aiGenerate(ctx) {
  const systemPrompt = `You write Facebook outreach posts for Bruce's AI services business targeting small local service companies (currently junk removal / hauling). Follow these rules exactly:

TONE: lowercase, casual, human-written, short punchy sentences, no AI-sounding language, no corporate phrasing, no hashtags, sounds like a real Facebook group post, never a landing page.

FORMAT: produce exactly two versions.
1. gifVersion: about 3 lines, short, strong hook, written for a Facebook background-image text post.
2. normalVersion: fuller length (roughly 4-6 short lines), explains a real benefit of the offer, still casual.

CTA RULES: never use "comment below", "dm me", "drop a [emoji] if...", or any direct engagement-bait phrasing. Use soft, open-ended CTAs like "reach out if that's you" or "send a message my way".

OFFER FRAMING: lead with the outcome (more jobs, more calls, more local recognition), not the mechanism or tool name. State plainly that they own it and can host it anywhere, no strings. The limited spots is a genuine operational constraint, not fake urgency — frame it that way. Ask for feedback as the low-friction "price" of the free build. Do not mention hosting costs or fine print in the post itself.

WORD CHOICE: use the exact cost phrase provided instead of assuming the word "free" is safe — some Facebook groups flag it.

Respond with ONLY valid JSON, no markdown fences, no commentary, in exactly this shape:
{"gifVersion": "...", "normalVersion": "..."}`;

  const userPrompt = `Niche: ${ctx.niche}
Offer: ${ctx.offerType}
Spots available: ${ctx.spots}
Cost phrasing to use: ${ctx.costPhrase}
Additional context: ${ctx.extra || 'none'}`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      system: systemPrompt,
      messages: [{ role: "user", content: userPrompt }]
    })
  });
  if (!response.ok) throw new Error('API request failed');
  const data = await response.json();
  const text = (data.content || []).map(b => b.text || '').join('');
  const clean = text.replace(/```json|```/g, '').trim();
  return JSON.parse(clean);
}

async function handleGenerate() {
  const ctx = {
    niche: document.getElementById('cNiche').value.trim() || 'junk removal businesses',
    offerType: document.getElementById('cOffer').value,
    spots: document.getElementById('cSpots').value || '2',

    extra: document.getElementById('cExtra').value.trim()

  const btn = document.getElementById('generateBtn');
  btn.disabled = true;

  if (creatorMode === 'ai') {
    statusEl.textContent = 'asking claude...';
    try {
      const result = await aiGenerate(ctx);
      lastGenerated = { ...result, ctx };
      statusEl.textContent = '';

    } catch (e) {
      statusEl.textContent = '';
      showToast('Live AI generation failed — used template instead');
      const result = templateGenerate(ctx);

    }

    const result = templateGenerate(ctx);
    lastGenerated = { ...result, ctx };
    statusEl.textContent = '';

  }
  btn.disabled = false;
}

  document.querySelectorAll('[data-status-select]').forEach(sel => sel.onchange = () => {
    const post = appState.posts.find(p => p.id === sel.dataset.statusSelect);
    if (post) {
      post.status = sel.value;
      if (sel.value === 'posted' && post.groupId) {
        const grp = appState.groups.find(g => g.id === post.groupId);
        if (grp) { grp.lastPostDate = todayISO(); persist('groups'); }
      }
      persist('posts'); renderLibrary(); showToast('Status updated');
    }
  });
  document.querySelectorAll('[data-delete-post]').forEach(b => b.onclick = () => {
    confirmAction('Delete this post from your library?', () => {
      appState.posts = appState.posts.filter(p => p.id !== b.dataset.deletePost);
      persist('posts'); renderLibrary(); showToast('Post deleted');
    });
  });
}

/* ================= TODO ================= */
function renderTodo() {
  const cols = [ ['todo','To do'], ['in-progress','In progress'], ['done','Done'] ];
  document.getElementById('page-todo').innerHTML = `
    ${pageHeader('005','Todo','What still needs doing, sorted by stage.')}
    <div class="btn-row" style="margin-bottom:16px;"><button class="btn btn-primary" id="addTodoBtn">+ Add task</button></div>
    <div class="kanban">
      ${cols.map(([key,label]) => {
        const items = appState.todos.filter(t => t.status === key).sort((a,b) => (a.dueDate||'9999').localeCompare(b.dueDate||'9999'));
        return `
        <div class="kanban-col">
          <div class="kanban-col-title">${label} <span class="kanban-count">${items.length}</span></div>
          ${items.length === 0 ? '<div class="empty-state" style="padding:10px 2px;">Empty</div>' : items.map(t => `
            <div class="task-card">
              <div class="task-title">${esc(t.title)}</div>
              <div class="task-meta">
                ${priorityPill(t.priority)}
                ${t.dueDate ? `<span>due ${fmtDate(t.dueDate)}</span>` : ''}
                ${t.groupId ? `<span>· ${esc(groupName(t.groupId) || '')}</span>` : ''}
              </div>
              <div class="task-actions">
                ${key !== 'todo' ? `<button class="btn btn-sm" data-move="${t.id}:${key==='done'?'in-progress':'todo'}">&larr;</button>` : ''}
                ${key !== 'done' ? `<button class="btn btn-sm" data-move="${t.id}:${key==='todo'?'in-progress':'done'}">&rarr;</button>` : ''}
                <button class="btn btn-sm btn-ghost btn-danger" data-del-todo="${t.id}">Delete</button>
              </div>
            </div>
          `).join('')}
        </div>`;
      }).join('')}
    </div>
  `;
  document.getElementById('addTodoBtn').onclick = openTodoModal;
  document.querySelectorAll('[data-move]').forEach(b => b.onclick = () => {
    const [id, newStatus] = b.dataset.move.split(':');
    const t = appState.todos.find(t => t.id === id);
    if (t) { t.status = newStatus; persist('todos'); renderTodo(); }
  });
  document.querySelectorAll('[data-del-todo]').forEach(b => b.onclick = () => {
    confirmAction('Delete this task?', () => {
      appState.todos = appState.todos.filter(t => t.id !== b.dataset.delTodo);
      persist('todos'); renderTodo(); showToast('Task deleted');
    });
  });
}
function openTodoModal() {
  openModal(`
    <h3>Add task</h3>
    <div class="field"><label>Task</label><input type="text" id="tTitle" placeholder="e.g. follow up with Mike Daniels" /></div>
    <div class="field-row">
      <div class="field"><label>Due date</label><input type="date" id="tDue" /></div>
      <div class="field"><label>Priority</label>
        <select id="tPriority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select>
      </div>
    </div>
    <div class="field"><label>Linked group</label>
      <select id="tGroup"><option value="">— none —</option>${appState.groups.map(g => `<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select>
    </div>
    <div class="btn-row" style="justify-content:flex-end;">
      <button class="btn" id="tCancel">Cancel</button>
      <button class="btn btn-primary" id="tSave">Add task</button>
    </div>
  `);
  document.getElementById('tCancel').onclick = closeModal;
  document.getElementById('tSave').onclick = () => {
    const title = document.getElementById('tTitle').value.trim();
    if (!title) { showToast('Task title is required'); return; }
    appState.todos.unshift({
      id: genId('todo'), title,
      dueDate: document.getElementById('tDue').value || null,
      priority: document.getElementById('tPriority').value,
      groupId: document.getElementById('tGroup').value || null,
      status: 'todo', createdAt: new Date().toISOString()
    });
    persist('todos'); closeModal(); renderTodo(); showToast('Task added');
  };
}

/* ================= PLAYBOOK ================= */
function renderPlaybook() {
  document.getElementById('page-playbook').innerHTML = `
    ${pageHeader('REF','Playbook','The rules this whole system runs on. The generator follows this too.')}

    <div class="panel pb-section">
      <h3>Format — two versions, every time</h3>
      <ul>
        <li><strong>Gif post version</strong> — about 3 lines, short, strong hook, for background-image FB posts.</li>
        <li><strong>Normal version</strong> — fuller length, explains a real benefit, still casual and human.</li>
      </ul>
    </div>

    <div class="panel pb-section">
      <h3>Tone &amp; style</h3>
      <ul>
        <li>Lowercase, casual, human-written — like a real person typing, not an ad</li>
        <li>Short, punchy sentences</li>
        <li>No AI-sounding language, no corporate phrasing, no hashtags/tags</li>
        <li>Sounds like it belongs in a FB group feed, not a landing page</li>
      </ul>
    </div>

    <div class="panel pb-section">
      <h3>CTA rules</h3>
      <ul>
        <li>Never: "comment below," "dm me," "drop a [emoji] if…" — FB tends to flag/suppress these</li>
        <li>Use soft, open-ended CTAs: "reach out if that's you," "send a message my way"</li>
      </ul>
    </div>

    <div class="panel pb-section">
      <h3>Offer framing</h3>
      <ul>
        <li>Lead with the outcome, not the mechanism ("more jobs," "more calls" — not "AI review agent")</li>
        <li>State plainly: they own it, host anywhere, no strings, no hidden charges</li>
        <li>"Only taking 2 clients" is a real operational constraint, not fake urgency</li>
        <li>Feedback is the "price" of the free build — keeps it low-friction and non-salesy</li>
        <li>Don't mention hosting costs or fine print in the post itself — save that for the DM</li>
      </ul>
    </div>

    <div class="panel pb-section">
      <h3>Word choice watch-outs</h3>
      <p>"Free" is a commonly configured keyword filter in Facebook group Admin Assist. If a group keeps flagging posts, swap it for "at no cost" or "on the house."</p>
    </div>

    <div class="panel pb-section">
      <h3>Compliance</h3>
      <p>Always check a group's specific rules before posting or commenting for outreach.</p>
    </div>

    <div class="panel pb-section">
      <h3>Avoiding "pending" status</h3>
      <ul>
        <li>No links or URLs in posts</li>
        <li>Don't edit a post right after publishing</li>
        <li>Avoid flagged/spammy keywords specific to a group</li>
        <li>Don't cross-post identical text across multiple groups back-to-back — space it out over hours</li>
        <li>Build genuine, non-promotional activity on the account over time</li>
      </ul>
    </div>

    <div class="panel pb-section">
      <h3>Core principles</h3>
      <ul>
        <li><strong>Sequence matters</strong> — one offer first, prove results, then layer in the next.</li>
        <li><strong>Discovery before pitch</strong> — surface pain points before pivoting to a solution.</li>
        <li><strong>Sell the outcome, not the mechanism</strong> — lead with what the owner gets.</li>
        <li><strong>Genuine framing throughout</strong> — scarcity, free offers, and pricing stated honestly.</li>
      </ul>
    </div>
  `;
}
